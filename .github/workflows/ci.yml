name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Install tools
        run: brew install xcodegen swiftlint swiftformat
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        # Runners have no signing certificate; a compile check does not need one.
        run: make build XCODE_FLAGS="CODE_SIGNING_ALLOWED=NO"
